<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تفادي السيارات</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.5rem;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 600px;
            background: #333;
            border: 4px solid #555;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
            background: #444;
        }
        .ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            display: none;
        }
        #game-over-screen h2 {
            color: #ff3333;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .btn {
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
            transition: 0.2s;
        }
        .btn:hover {
            background: #ffd633;
            transform: scale(1.05);
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
        }
        /* أزرار اللمس للموبايل */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 360px;
            margin-top: 10px;
            gap: 10px;
        }
        .mob-btn {
            flex: 1;
            background: #222;
            color: #ffcc00;
            border: 2px solid #555;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .mob-btn:active {
            background: #ffcc00;
            color: #111;
        }
    </style>
</head>
<body>

    <h1>لعبة سباق المراوغة</h1>
    
    <div id="game-container">
        <div class="ui-layer">
            <span id="score-display">النقاط: 0</span>
            <span id="high-score-display">الأعلى: 0</span>
        </div>

        <div id="game-over-screen">
            <h2>انتهت اللعبة!</h2>
            <p id="final-score" style="font-size: 1.3rem; margin: 5px 0;">نقاطك: 0</p>
            <button class="btn" onclick="restartGame()">إلعب مجدداً</button>
        </div>

        <canvas id="gameCanvas" width="360" height="600"></canvas>
    </div>

    <div class="mobile-controls">
        <div class="mob-btn" id="btn-right">➡️ يمين</div>
        <div class="mob-btn" id="btn-left">⬅️ يسار</div>
    </div>

    <div class="controls-hint">
        التحكم: استخدم أزرار الأسهم (يمين / يسار) في الكيبورد أو الأزرار بالأسفل.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');

        let score = 0;
        let highScore = localStorage.getItem('carHighScore') || 0;
        highScoreDisplay.innerText = `الأعلى: ${highScore}`;

        let gameRunning = true;
        let roadSpeed = 4;
        let roadLineOffset = 0;

        // إعدادات اللاعب (السيارة الحمراء)
        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 110,
            width: 40,
            height: 70,
            speed: 6,
            color: '#e74c3c'
        };

        // مفاتيح التحكم
        let keys = {
            ArrowRight: false,
            ArrowLeft: false
        };

        // سيارات العدو
        let enemies = [];
        let spawnTimer = 0;
        let spawnInterval = 70; // معدل ظهور السيارات

        // الاستماع لأزرار لوحة المفاتيح
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.ArrowRight = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.ArrowLeft = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.ArrowRight = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.ArrowLeft = false;
        });

        // دعم اللمس للأجهزة الذكية
        const btnRight = document.getElementById('btn-right');
        const btnLeft = document.getElementById('btn-left');

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowRight = true; });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowRight = false; });
        btnRight.addEventListener('mousedown', () => { keys.ArrowRight = true; });
        btnRight.addEventListener('mouseup', () => { keys.ArrowRight = false; });

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowLeft = true; });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowLeft = false; });
        btnLeft.addEventListener('mousedown', () => { keys.ArrowLeft = true; });
        btnLeft.addEventListener('mouseup', () => { keys.ArrowLeft = false; });

        // رسم السيارة بتصميم بسيط وأنيق
        function drawCar(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x + 5, y + 10, width - 10, height - 20); // هيكل السيارة
            
            // المقدمة والمؤخرة
            ctx.fillRect(x, y + 15, width, height - 30);
            
            // زجاج السيارة
            ctx.fillStyle = '#222';
            ctx.fillRect(x + 8, y + 18, width - 16, 15);
            ctx.fillRect(x + 8, y + height - 30, width - 16, 10);

            // الإطارات
            ctx.fillStyle = '#111';
            ctx.fillRect(x - 3, y + 12, 4, 14);
            ctx.fillRect(x + width - 1, y + 12, 4, 14);
            ctx.fillRect(x - 3, y + height - 26, 4, 14);
            ctx.fillRect(x + width - 1, y + height - 26, 4, 14);

            // أضواء أمامية
            ctx.fillStyle = '#ffeb3b';
            ctx.fillRect(x + 3, y + 2, 6, 4);
            ctx.fillRect(x + width - 9, y + 2, 6, 4);
        }

        // رسم الطريق والخطوط المتحركة
        function drawRoad() {
            // لون الأسفلت
            ctx.fillStyle = '#474747';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // الأرصفة الجانبية
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(0, 0, 15, canvas.height);
            ctx.fillRect(canvas.width - 15, 0, 15, canvas.height);

            // خطوط الطريق المتصلة الجانبية
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(20, canvas.height);
            ctx.moveTo(canvas.width - 20, 0); ctx.lineTo(canvas.width - 20, canvas.height);
            ctx.stroke();

            // الخطوط المتقطعة في المنتصف المتحركة
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 5;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadLineOffset;

            ctx.beginPath();
            ctx.moveTo(canvas.width / 3, 0);
            ctx.lineTo(canvas.width / 3, canvas.height);
            ctx.moveTo((canvas.width / 3) * 2, 0);
            ctx.lineTo((canvas.width / 3) * 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // إعادة ضبط الخطوط
        }

        // إنشاء سيارة عدو عشوائية في أحد الممرات الثلاثة
        function spawnEnemy() {
            const lanes = [30, canvas.width / 2 - 20, canvas.width - 70];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            const colors = ['#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            enemies.push({
                x: randomLane,
                y: -90,
                width: 40,
                height: 70,
                speed: roadSpeed + 1.5 + Math.random() * 1.5,
                color: randomColor
            });
        }

        // فحص التصادم بين سيارتين
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // تحديث حالة اللعبة
        function update() {
            if (!gameRunning) return;

            // تحريك الخطوط والأرضية
            roadLineOffset += roadSpeed;
            if (roadLineOffset > 60) roadLineOffset = 0;

            // تحديث حركة اللاعب (مع تعديل الاتجاهات: اليمين يتحرك يمينًا واليسار يتحرك يسارًا)
            if (keys.ArrowRight && player.x < canvas.width - player.width - 20) {
                player.x += player.speed;
            }
            if (keys.ArrowLeft && player.x > 20) {
                player.x -= player.speed;
            }

            // توليد سيارات الأعداء
            spawnTimer++;
            if (spawnTimer > spawnInterval) {
                spawnEnemy();
                spawnTimer = 0;
                // زيادة الصعوبة تدريجياً مع الوقت
                if (spawnInterval > 30) spawnInterval -= 1;
            }

            // تحديث سيارات الأعداء
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                // فحص التصادم مع اللاعب
                if (checkCollision(player, enemies[i])) {
                    gameRunning = false;
                    gameOverScreen.style.display = 'flex';
                    finalScoreText.innerText = `نقاطك: ${Math.floor(score)}`;
                    
                    if (score > highScore) {
                        highScore = Math.floor(score);
                        localStorage.setItem('carHighScore', highScore);
                        highScoreDisplay.innerText = `الأعلى: ${highScore}`;
                    }
                }

                // حذف السيارات التي تخرج من الشاشة وحساب النقاط
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10;
                    scoreDisplay.innerText = `النقاط: ${Math.floor(score)}`;
                    
                    // زيادة سرعة اللعبة تدريجياً بمرور النقاط
                    roadSpeed = 4 + Math.floor(score / 100);
                }
            }
        }

        // رسم عناصر اللعبة على الـ Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            // رسم سيارات الأعداء
            for (let enemy of enemies) {
                drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.color);
            }

            // رسم سيارة اللاعب
            drawCar(player.x, player.y, player.width, player.height, player.color);
        }

        // حلقة اللعبة الرئيسية (Game Loop)
        function loop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(loop);
            }
        }

        // إعادة تشغيل اللعبة
        function restartGame() {
            score = 0;
            scoreDisplay.innerText = `النقاط: 0`;
            roadSpeed = 4;
            spawnInterval = 70;
            enemies = [];
            player.x = canvas.width / 2 - 20;
            gameRunning = true;
            gameOverScreen.style.display = 'none';
            loop();
        }

        // بدء اللعبة للمرة الأولى
        loop();
    </script>
</body>
</html>
